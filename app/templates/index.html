<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onit - Sign In</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <div class="page">
        <main class="main">
            <section class="login-card" aria-label="Sign in">

                <div class="brand">
                    <div class="brand-icon">◐</div>
                    <div class="brand-name">Onit</div>
                </div>

                <h1 class="title">Sign in</h1>

                <button
                    class="employee-btn"
                    type="button"
                    onclick="employeeLogin()">
                    Onit Employees
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <form
                    id="loginForm"
                    method="POST"
                    action="/login">

                    <div class="field">
                        <div class="field-header">
                            <label for="email">Email</label>
                        </div>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="Enter Email"
                            autocomplete="email"
                            required>
                    </div>

                    <div class="field password-field">
                        <div class="field-header">
                            <label for="password">Password</label>

                            <a
                                class="forgot"
                                href="#"
                                onclick="forgotPassword(event)">
                                Forgot Your Password?
                            </a>
                        </div>

                        <div class="input-wrap">
                            <input
                                id="password"
                                name="password"
                                class="password-input"
                                type="password"
                                placeholder="Enter Password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="eye-button"
                                id="eyeButton"
                                onclick="togglePassword()"
                                aria-label="Show password"
                                title="Show password">

                                <svg
                                    class="eye-icon"
                                    id="eyeIcon"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg">

                                    <!-- Eye -->
                                    <path
                                        id="eyeOpen"
                                        d="M2.5 12C2.5 12 6 6.5 12 6.5C18 6.5 21.5 12 21.5 12C21.5 12 18 17.5 12 17.5C6 17.5 2.5 12 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>

                                    <circle
                                        id="eyePupil"
                                        cx="12"
                                        cy="12"
                                        r="2.5"
                                        stroke="currentColor"
                                        stroke-width="1.8"/>

                                    <!-- Slash -->
                                    <path
                                        id="eyeSlash"
                                        d="M3 3L21 21"
                                        stroke="currentColor"
                                        stroke-width="1.8"
                                        stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <label class="remember">
                        <input
                            id="remember"
                            name="remember"
                            type="checkbox">

                        <span>Remember me</span>
                    </label>

                    {% if error %}
                        <div class="error-message">
                            {{ error }}
                        </div>
                    {% endif %}

                    <button
                        class="login-btn"
                        type="submit">
                        Login
                    </button>
                </form>
            </section>
        </main>

        <footer class="footer">
            © 2026 Onit, Inc. All rights reserved
            <a href="#">Privacy</a> |
            <a href="#">Help</a> |
            <a href="#">Contact Us</a> |
            <a href="#">Terms</a>
        </footer>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const eyeButton = document.getElementById("eyeButton");
            const eyeOpen = document.getElementById("eyeOpen");
            const eyePupil = document.getElementById("eyePupil");
            const eyeSlash = document.getElementById("eyeSlash");

            if (password.type === "password") {
                // Show password
                password.type = "text";

                // Show normal eye
                eyeSlash.style.display = "none";
                eyeOpen.style.display = "block";
                eyePupil.style.display = "block";

                eyeButton.setAttribute("aria-label", "Hide password");
                eyeButton.setAttribute("title", "Hide password");

            } else {
                // Hide password
                password.type = "password";

                // Show crossed eye
                eyeSlash.style.display = "block";
                eyeOpen.style.display = "block";
                eyePupil.style.display = "block";

                eyeButton.setAttribute("aria-label", "Show password");
                eyeButton.setAttribute("title", "Show password");
            }
        }


        function employeeLogin() {
            alert("Onit employee sign-in would start here.");
        }

        function forgotPassword(event) {
            event.preventDefault();
            alert("Password reset flow would start here.");
        }
    </script>
</body>
</html>
