<div id="createMatterModal" class="modal">
    <div class="modal-card">
        <div class="modal-head">
            <h2>Matter</h2>
            <button class="icon-btn" type="button" data-modal-close aria-label="Close">&times;</button>
        </div>
        <form method="POST" action="{{ url_for('matters.new_matter') }}" data-loading-text="Creating transaction...">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="matter_manager_id">Matter Manager <span class="req">*</span></label>
                <select id="matter_manager_id" name="matter_manager_id" required>
                    <option value="">Select a manager</option>
                    {% for user in matter_form_choices.managers %}
                    <option value="{{ user.id }}">{{ user.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="matter_name">Matter Name <span class="req">*</span></label>
                <input id="matter_name" name="matter_name" required>
            </div>
            <div class="field">
                <label for="opened_on">Matter Opened On</label>
                <input id="opened_on" name="opened_on" type="date">
            </div>
            <div class="field">
                <label for="brief_description">Brief Matter Description</label>
                <textarea id="brief_description" name="brief_description" rows="3"></textarea>
            </div>
            <div class="field">
                <label for="market">Market <span class="req">*</span></label>
                <select id="market" name="market" required>
                    <option value="">Select a market</option>
                    {% for value in matter_form_choices.markets %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="area_of_law">Area Of Law <span class="req">*</span></label>
                <select id="area_of_law" name="area_of_law" required>
                    <option value="">Select an area of law</option>
                    {% for value in matter_form_choices.areas_of_law %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="region">Region</label>
                <select id="region" name="region">
                    <option value="">Select a region</option>
                    {% for value in matter_form_choices.regions %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="matter_type">Matter Type <span class="req">*</span></label>
                <select id="matter_type" name="matter_type" required>
                    <option value="">Select a matter type</option>
                    {% for value in matter_form_choices.matter_types %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="legal_entity">Legal Entity <span class="req">*</span></label>
                <select id="legal_entity" name="legal_entity" required>
                    <option value="">Select a legal entity</option>
                    {% for value in matter_form_choices.legal_entities %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="currency">Matter Currency <span class="req">*</span></label>
                <select id="currency" name="currency" required>
                    {% for value in matter_form_choices.currencies %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="payment_method">Payment Method</label>
                <select id="payment_method" name="payment_method">
                    <option value="">Select a payment method</option>
                    {% for value in matter_form_choices.payment_methods %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="total_budget">Total Budget</label>
                <input id="total_budget" name="total_budget" type="number" step="0.01" min="0" value="0">
            </div>
            <div class="form-actions">
                <button class="btn btn-light" type="button" data-modal-close>Cancel</button>
                <button class="btn btn-primary" type="submit">Submit Matter</button>
            </div>
        </form>
    </div>
</div>
