{% extends "base.html" %}
{% block title %}Create Invoice &middot; {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Create Invoice</h1></div>
<section class="panel form-panel">
    <form method="POST" data-loading-text="Creating invoice...">
        <div class="field"><label for="invoice_number">Invoice Number <span class="req">*</span></label>
            <input id="invoice_number" name="invoice_number" value="{{ form.get('invoice_number', '') }}" required></div>
        <div class="field">
            <label for="matter_id">Matter</label>
            <select id="matter_id" name="matter_id">
                <option value="">Not linked to a matter</option>
                {% for matter in matters %}
                <option value="{{ matter.id }}" {% if form.get('matter_id') == matter.id | string %}selected{% endif %}>{{ matter.matter_number }} &mdash; {{ matter.matter_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="field"><label for="vendor_name">Vendor <span class="req">*</span></label>
            <input id="vendor_name" name="vendor_name" value="{{ form.get('vendor_name', '') }}" required></div>
        <div class="field"><label for="invoice_date">Invoice Date</label>
            <input id="invoice_date" name="invoice_date" type="date" value="{{ form.get('invoice_date', '') }}"></div>
        <div class="field"><label for="amount">Amount <span class="req">*</span></label>
            <input id="amount" name="amount" type="number" step="0.01" min="0" value="{{ form.get('amount', '0') }}" required></div>
        <div class="field">
            <label for="currency">Currency</label>
            <select id="currency" name="currency">
                {% for value in currencies %}<option value="{{ value }}" {% if form.get('currency') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}
            </select>
        </div>
        <div class="field"><label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ form.get('description', '') }}</textarea></div>
        <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for value in statuses %}<option value="{{ value }}" {% if form.get('status') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <a class="btn btn-light" href="{{ url_for('invoices.list_invoices') }}">Cancel</a>
            <button class="btn btn-primary" type="submit">Submit Invoice</button>
        </div>
    </form>
</section>
{% endblock %}
