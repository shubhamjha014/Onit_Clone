{% extends "base.html" %}
{% block title %}{{ 'Edit' if contact else 'Add' }} Contact &middot; {{ app_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ 'Edit' if contact else 'Add' }} Contact</h1></div>
<section class="panel form-panel">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field"><label for="name">Contact Name <span class="req">*</span></label>
            <input id="name" name="name" value="{{ form.get('name', '') }}" required></div>
        <div class="field"><label for="email">Email <span class="req">*</span></label>
            <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required></div>
        <div class="field"><label for="phone">Phone</label>
            <input id="phone" name="phone" value="{{ form.get('phone', '') or '' }}"></div>
        <div class="field"><label for="organization">Organization</label>
            <input id="organization" name="organization" value="{{ form.get('organization', '') or '' }}"></div>
        <div class="field"><label for="role">Role</label>
            <input id="role" name="role" value="{{ form.get('role', '') or '' }}"></div>
        <div class="field">
            <label for="contact_type">Contact Type</label>
            <select id="contact_type" name="contact_type">
                {% for value in contact_types %}<option value="{{ value }}" {% if form.get('contact_type') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <a class="btn btn-light" href="{{ url_for('contacts.list_contacts') }}">Cancel</a>
            <button class="btn btn-primary" type="submit">Save Contact</button>
        </div>
    </form>
</section>
{% endblock %}
