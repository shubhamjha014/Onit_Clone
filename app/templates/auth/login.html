<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-body">
    <main class="login-main">
        <section class="login-card">
            <div class="login-brand">
                <span class="brand-mark">LM</span>
                <span>{{ app_name }}</span>
            </div>
            <h1 class="login-title">Sign in</h1>
            {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ email or 'demo@example.com' }}" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" value="demo1234" required>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Sign in</button>
            </form>
            <p class="login-hint">Demo user: demo@example.com / demo1234</p>
        </section>
    </main>
</body>
</html>
