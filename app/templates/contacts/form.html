<!-- Create/Edit Contact Modal -->
<div class="modal" id="create-contact-modal">
    <div class="modal-card">
        <div class="modal-head">
            <h2>{{ 'Edit' if contact else 'Add New' }} Contact</h2>
            <button type="button" class="icon-btn" data-modal-close>&times;</button>
        </div>
        <form method="POST" action="{{ url_for('contacts.new_contact') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="name">Contact Name <span class="req">*</span></label>
                <input id="name" name="name" value="{{ form.get('name', '') }}" required>
            </div>
            <div class="field">
                <label for="email">Email <span class="req">*</span></label>
                <input id="email" name="email" type="email" value="{{ form.get('email', '') }}" required>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" value="{{ form.get('phone', '') or '' }}">
            </div>
            <div class="field">
                <label for="organization">Organization</label>
                <input id="organization" name="organization" value="{{ form.get('organization', '') or '' }}">
            </div>
            <div class="field">
                <label for="role">Role</label>
                <input id="role" name="role" value="{{ form.get('role', '') or '' }}">
            </div>
            <div class="field">
                <label for="contact_type">Contact Type</label>
                <select id="contact_type" name="contact_type">
                    {% for value in contact_types %}
                        <option value="{{ value }}" {% if form.get('contact_type') == value %}selected{% endif %}>{{ value }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-light" data-modal-close>Cancel</button>
                <button class="btn btn-primary" type="submit">Save Contact</button>
            </div>
        </form>
    </div>
</div>
