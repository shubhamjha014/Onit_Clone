<!-- Create Invoice Modal -->
<div class="modal" id="create-invoice-modal">
    <div class="launch-modal-card" style="max-width: 800px;">
        <div class="launch-modal-head">
            <h2>Create Invoice</h2>
            <button class="icon-btn" type="button" data-modal-close aria-label="Close">&times;</button>
        </div>
        
        <form method="POST" action="{{ url_for('invoices.new_invoice') }}" style="margin: 0;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Hidden field to keep legacy backend perfectly intact -->
            <input type="hidden" name="amount" id="hidden_amount" value="0">
            
            <style>
                .invoice-grid {
                    display: grid;
                    grid-template-columns: 200px 1fr;
                    gap: 16px 24px;
                    align-items: center;
                    padding: 24px;
                }
                .invoice-grid label {
                    font-size: 13px;
                    color: #333;
                    font-weight: 500;
                    margin: 0;
                }
                .invoice-grid .req { color: #d32f2f; }
                .invoice-grid input, .invoice-grid select, .invoice-grid textarea {
                    width: 100%;
                    padding: 8px 12px;
                    border: 1px solid #ccc;
                    border-radius: 4px;
                    font-family: inherit;
                    font-size: 13px;
                }
                .invoice-grid input[readonly], .invoice-grid select:disabled {
                    background-color: #f5f5f5;
                    color: #666;
                    cursor: not-allowed;
                }
                /* Distinct styling for the calculated Net fields */
                .invoice-grid .net-calc-field {
                    background-color: #fcfcfc;
                    border: 1px dashed #bbb;
                    color: #444;
                    font-weight: bold;
                }
                .section-title {
                    grid-column: 1 / -1;
                    font-size: 13px;
                    font-weight: 600;
                    color: #b8860b; 
                    border-bottom: 1px dashed #e0e0e0;
                    padding-bottom: 8px;
                    margin-top: 8px;
                    margin-bottom: 8px;
                }
            </style>

            <div class="invoice-grid">
                
                <!-- System Links -->
                <label for="matter_id">Matter</label>
                <div>
                    {% if fixed_matter_id %}
                        <input type="hidden" name="matter_id" value="{{ fixed_matter_id }}">
                        <select id="matter_id" disabled>
                            {% for matter in matters %}
                                {% if fixed_matter_id == matter.id %}
                                    <option value="{{ matter.id }}" selected>{{ matter.matter_number }} &mdash; {{ matter.matter_name }}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    {% else %}
                        <select id="matter_id" name="matter_id">
                            <option value="">Not linked to a matter</option>
                            {% for matter in matters %}
                            <option value="{{ matter.id }}">{{ matter.matter_number }} &mdash; {{ matter.matter_name }}</option>
                            {% endfor %}
                        </select>
                    {% endif %}
                </div>

                <label for="vendor_name">Vendor <span class="req">*</span></label>
                <div>
                    {% if fixed_vendor_name %}
                        <input type="hidden" name="vendor_name" value="{{ fixed_vendor_name }}">
                        <select id="vendor_name" disabled>
                            <option value="{{ fixed_vendor_name }}" selected>{{ fixed_vendor_name }}</option>
                        </select>
                    {% else %}
                        <select id="vendor_name" name="vendor_name" required>
                            <option value="" disabled selected>Select a vendor...</option>
                            {% for v in vendors %}
                                <option value="{{ v.name }}">{{ v.name }}</option>
                            {% endfor %}
                        </select>
                    {% endif %}
                </div>

                <div class="section-title">Manual Invoice</div>

                <label for="invoice_number">Invoice Number <span class="req">*</span></label>
                <input id="invoice_number" name="invoice_number" required placeholder="Cannot contain special characters, spaces or exceed 22 characters">

                <label for="invoice_date">Invoice Date</label>
                <input id="invoice_date" name="invoice_date" type="date">

                <label for="billing_start_date">Billing Start Date</label>
                <input id="billing_start_date" name="billing_start_date" type="date">

                <label for="billing_end_date">Billing End Date</label>
                <input id="billing_end_date" name="billing_end_date" type="date">

                <label for="currency">Currency <span class="req">*</span></label>
                <select id="currency" name="currency" required>
                    {% for value in currencies %}<option value="{{ value }}">{{ value }}</option>{% endfor %}
                </select>

                <!-- FEES SECTION -->
                <label for="fees">Fees <span class="req">*</span></label>
                <input id="fees" name="fees" type="number" step="0.01" class="calc-trigger" required>

                <label for="fees_discount">Fees Discount</label>
                <input id="fees_discount" name="fees_discount" type="number" step="0.01" class="calc-trigger" placeholder="Enter discount amount">

                <label>Net Fees</label>
                <input id="net_fees_display" class="net-calc-field" type="text" readonly placeholder="0.00" tabindex="-1">

                <!-- EXPENSES SECTION -->
                <label for="expenses">Expenses <span class="req">*</span></label>
                <input id="expenses" name="expenses" type="number" step="0.01" class="calc-trigger" required>

                <label for="expenses_discount">Expenses Discount</label>
                <input id="expenses_discount" name="expenses_discount" type="number" step="0.01" class="calc-trigger" placeholder="Enter discount amount">

                <label>Net Expenses</label>
                <input id="net_expenses_display" class="net-calc-field" type="text" readonly placeholder="0.00" tabindex="-1">

                <!-- TAXES & TOTAL SECTION -->
                <label for="taxes">Taxes</label>
                <input id="taxes" name="taxes" type="number" step="0.01" class="calc-trigger">

                <label>Total</label>
                <input id="total_display" type="text" readonly placeholder="0.00" style="font-weight: bold; background-color: #e8f4fd; color: #0d47a1;" tabindex="-1">

                <label for="manual_invoice_type">Manual Invoice Type <span class="req">*</span></label>
                <select id="manual_invoice_type" name="manual_invoice_type" required>
                    <option value="" disabled selected></option>
                    <option value="Standard">Standard</option>
                    <option value="Credit">Credit Note</option>
                </select>

            </div>
            
            <div class="launch-modal-footer">
                <button class="btn btn-light" type="button" data-modal-close style="margin-right: 10px;">Cancel</button>
                <button class="btn-submit" type="submit" style="background-color: #f1c40f; color: #333; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;">Submit Invoice</button>
            </div>
        </form>
    </div>
</div>

<script>
    function calculateInvoiceTotal() {
        const fees = parseFloat(document.getElementById('fees').value) || 0;
        // Math.abs ensures that whether a user types "10" or "-10", it behaves as a clean deduction
        const feesDisc = Math.abs(parseFloat(document.getElementById('fees_discount').value) || 0);
        
        const exp = parseFloat(document.getElementById('expenses').value) || 0;
        const expDisc = Math.abs(parseFloat(document.getElementById('expenses_discount').value) || 0);
        
        const taxes = parseFloat(document.getElementById('taxes').value) || 0;
        
        // Calculate sub-totals
        const netFees = fees - feesDisc;
        const netExp = exp - expDisc;
        
        // Calculate master total
        const total = netFees + netExp + taxes;
        
        // Update visual display fields (Dummy UI fields, not saved to DB)
        document.getElementById('net_fees_display').value = netFees.toFixed(2);
        document.getElementById('net_expenses_display').value = netExp.toFixed(2);
        document.getElementById('total_display').value = total.toFixed(2);
        
        // Update the hidden backend field that actually saves to the database
        document.getElementById('hidden_amount').value = total.toFixed(2);
    }

    // Attach listener to automatically recalculate on every keystroke
    document.querySelectorAll('.calc-trigger').forEach(input => {
        input.addEventListener('input', calculateInvoiceTotal);
    });
</script>
